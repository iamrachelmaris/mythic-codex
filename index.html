<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Family Mythic+ Codex</title>
<style>html,body{margin:0;background:#f7f3ea}</style>
</head>
<body>
<script>
/* Always load the newest page. GitHub Pages lets browsers keep old copies for
   10 minutes, so the real page lives in app.html and is fetched fresh here. */
fetch("app.html",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()})
  .then(t=>{document.open();document.write(t);document.close()})
  .catch(()=>{location.replace("app.html"+location.hash)});
</script>
</body>
</html>
